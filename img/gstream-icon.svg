<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="12" y="12" width="232" height="232" rx="44" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="44" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Glow beneath hex -->
  <ellipse cx="128" cy="128" rx="60" ry="55" fill="url(#glow)"/>

  <!-- Hexagon -->
  <polygon points="128,72 172,97 172,148 128,173 84,148 84,97"
           fill="url(#hex)" filter="url(#outerGlow)"/>

  <!-- Inner hex cutout -->
  <polygon points="128,90 158,107 158,140 128,157 98,140 98,107"
           fill="#0F172A"/>

  <!-- Play triangle inside hex -->
  <polygon points="120,106 120,142 142,124" fill="url(#hex)"/>

  <!-- Streaming particles -->
  <circle cx="184" cy="88"  r="3.5" fill="#22D3EE" opacity="0.9"/>
  <circle cx="192" cy="106" r="2.5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="196" cy="126" r="3"   fill="#818CF8" opacity="0.8"/>
  <circle cx="192" cy="146" r="2"   fill="#6366F1" opacity="0.6"/>
  <circle cx="184" cy="164" r="3.5" fill="#22D3EE" opacity="0.9"/>
</svg>